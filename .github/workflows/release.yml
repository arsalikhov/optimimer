# Tag a version (git tag v0.1.0 && git push --tags) and this publishes a GitHub Release with:
#   linux-arm64 / linux-amd64   .deb packages, tarballs, and a PKGBUILD for Arch (makepkg -si)
#   macos-arm64 / macos-amd64   tarballs
#   windows-amd64               zip
# plus a multi-arch container image at ghcr.io/<owner>/optimimer:<version> and :latest.
# Nobody installing needs a Rust toolchain — only this workflow builds.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-musl, name: linux-arm64,   arch: arm64 }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl,  name: linux-amd64,   arch: amd64 }
          - { os: macos-latest,   target: aarch64-apple-darwin,       name: macos-arm64 }
          - { os: macos-latest,   target: x86_64-apple-darwin,        name: macos-amd64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,     name: windows-amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: ${{ matrix.target }}
      - name: Build (Linux, static musl via zig)
        if: runner.os == 'Linux'
        run: |
          pip install cargo-zigbuild
          cd backend && cargo zigbuild --release --target ${{ matrix.target }}
      - name: Build (macOS / Windows)
        if: runner.os != 'Linux'
        run: cd backend && cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="${{ matrix.name }}"
          mkdir -p dist stage/agents
          cp backend/agents/*.json stage/agents/
          cp deploy/pkg/README-desktop.md stage/README.md
          if [ "${{ runner.os }}" = Windows ]; then
            cp "backend/target/${{ matrix.target }}/release/optimimer-backend.exe" stage/
            (cd stage && 7z a -tzip "../dist/optimimer-$VERSION-$NAME.zip" . >/dev/null)
          else
            BIN="backend/target/${{ matrix.target }}/release/optimimer-backend"
            cp "$BIN" stage/optimimer-backend
            if [ "${{ runner.os }}" = Linux ]; then
              cp "$BIN" "dist/optimimer-backend-${{ matrix.arch }}"
              cp deploy/optimimer-setup deploy/obsidian-sync.service deploy/pkg/optimimer.service \
                 deploy/pkg/optimimer.sysusers deploy/pkg/optimimer.tmpfiles README.md stage/
              deploy/deb/build.sh "$BIN" "${{ matrix.arch }}" "$VERSION" dist
              cp "dist/optimimer_${VERSION}_${{ matrix.arch }}.deb" "dist/optimimer-${{ matrix.arch }}.deb"
            fi
            tar -C stage -czf "dist/optimimer-$VERSION-$NAME.tar.gz" .
          fi
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Arch PKGBUILD with checksums
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          AMD=$(sha256sum "dist/optimimer-$VERSION-linux-amd64.tar.gz" | cut -d' ' -f1)
          ARM=$(sha256sum "dist/optimimer-$VERSION-linux-arm64.tar.gz" | cut -d' ' -f1)
          sed "s/@VERSION@/$VERSION/g; s/@SHA_AMD64@/$AMD/; s/@SHA_ARM64@/$ARM/" deploy/arch/PKGBUILD.in > dist/PKGBUILD
          (cd dist && sha256sum *.deb *.tar.gz *.zip PKGBUILD > SHA256SUMS)
      - name: Release notes (what each file is for)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          cat > dist/NOTES.md <<EOF
          ## Which file do I need?

          No toolchain required — every file is a prebuilt binary. Full guide: [docs/install.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/install.md).

          | File | For | Then |
          | ---- | --- | ---- |
          | \`optimimer-arm64.deb\` | Raspberry Pi OS, Debian, Ubuntu on 64-bit ARM (Pi 3/4/5) | \`sudo apt install ./optimimer-arm64.deb && sudo optimimer-setup\` |
          | \`optimimer-amd64.deb\` | Debian, Ubuntu on Intel/AMD PCs and servers | \`sudo apt install ./optimimer-amd64.deb && sudo optimimer-setup\` |
          | \`optimimer_${VERSION}_*.deb\` | The same two packages with versioned file names | |
          | \`PKGBUILD\` | Arch Linux, x86_64 and aarch64 (package \`optimimer-bin\`, checksums included) | \`makepkg -si && sudo optimimer-setup\` |
          | \`optimimer-${VERSION}-linux-arm64.tar.gz\` | Any other 64-bit ARM Linux with systemd (static binary, setup script, agents, unit) | unpack somewhere permanent, \`./optimimer-setup\` |
          | \`optimimer-${VERSION}-linux-amd64.tar.gz\` | Any other x86_64 Linux with systemd | unpack somewhere permanent, \`./optimimer-setup\` |
          | \`optimimer-${VERSION}-macos-arm64.tar.gz\` | Macs with Apple silicon (M1 and later) | unpack, follow the README inside |
          | \`optimimer-${VERSION}-macos-amd64.tar.gz\` | Intel Macs | unpack, follow the README inside |
          | \`optimimer-${VERSION}-windows-amd64.zip\` | Windows 10/11, 64-bit | unzip, follow the README inside |
          | \`SHA256SUMS\` | Checksums for everything above | \`sha256sum -c SHA256SUMS\` |

          **Docker** (any Linux): \`docker pull ${IMAGE}:${VERSION}\` — see the install guide for the run command.

          After installing, send the setup code the setup prints to your bot on Telegram; it pairs you as the owner and asks your name, timezone and categories.
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          body_path: dist/NOTES.md
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.tar.gz
            dist/*.zip
            dist/PKGBUILD
            dist/SHA256SUMS

  container:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "tags=$IMAGE:${GITHUB_REF_NAME#v},$IMAGE:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
